version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/oxicloud.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: oxicloud
    bump: patch
build:
  run_buildscript: false
images:
  # 主应用：上游只有 mutable latest tag，无 immutable 家族 → custom + created 排序 + bump: patch
  - id: oxicloud
    target: service
    service: oxicloud
    source: atareao/oxicloud
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: lazycat
  # postgres 辅助镜像：跟踪 17.x-alpine patch 家族，避开 17-alpine 等 mutable 别名
  - id: postgres
    target: service
    service: postgres
    source: library/postgres
    channel: custom
    sort: semver
    tag_regex: '^17\.\d+-alpine$'
    version_regex: '^(?P<version>17\.\d+)-alpine$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: OxiCloud
    summary: "NextCloud 的轻量级替代品"
